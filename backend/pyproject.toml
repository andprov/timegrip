[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "timegrip"
version = "0.1.5"
description = "timegrip api"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib",
    "alembic",
    "bcrypt",
    "dishka",
    "fastapi[standard]",
    "pyjwt",
    "psycopg[binary]",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "scalar-fastapi",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ruff>=0.11.10",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.ruff]
src = ["src"]
line-length = 79
exclude = ["__pycache__", ".git", ".venv*", "migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
    "COM812", # flake8-commas: missing trailing comma
]
fixable = ["I", "F401", "COM812"]
ignore = ["UP035", "UP006", "N813", "UP043"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.pytest.ini_options]
pythonpath = ["src/"]
norecursedirs = [".git", ".venv*"]
addopts = ["-vv", "-p no:cacheprovider", "-p no:warnings"]
python_files = ["test_*.py"]
testpaths = ["tests"]
