# certbot settings for both `obtain` and the renewal loop (see entrypoint.sh).
# Instance-specific values (DOMAIN, DOMAIN_ALIASES, CERTBOT_EMAIL,
# CERTBOT_STAGING) live in .env.
# Any long command-line option without leading dashes is accepted here:
# https://eff-certbot.readthedocs.io/en/stable/using.html#configuration-file

# Run without prompts and accept the Let's Encrypt Subscriber Agreement
non-interactive = true
agree-tos = true
# Do not share the account email with the EFF
no-eff-email = true

# HTTP-01 challenge: files are served by nginx from this shared directory
authenticator = webroot
webroot-path = /var/www/certbot

# Private key type:
#   key-type = ecdsa, elliptic-curve = secp256r1 | secp384r1
#   key-type = rsa,   rsa-key-size = 2048 | 3072 | 4096
# A change applies to an existing certificate on the next
# `docker compose run --rm certbot obtain`.
key-type = ecdsa
elliptic-curve = secp256r1
