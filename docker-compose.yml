name: timegrip

x-app: &app
  image: ghcr.io/andprov/timegrip-backend:${TIMEGRIP_VERSION:-latest}
  env_file: .env
  environment:
    DB_HOST: db
  networks:
    - timegrip

services:
  db:
    container_name: timegrip-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - timegrip

  migrate:
    <<: *app
    container_name: timegrip-migrate
    restart: on-failure
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    container_name: timegrip-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  outbox_email:
    <<: *app
    container_name: timegrip-outbox-email
    restart: unless-stopped
    command: ["python", "-m", "timegrip.workers.outbox_email"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cleanup:
    <<: *app
    container_name: timegrip-cleanup
    restart: unless-stopped
    command: ["sh", "-c", "while true; do python -m timegrip.workers.cleanup; sleep 3600; done"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    container_name: timegrip-frontend
    image: ghcr.io/andprov/timegrip-frontend:${TIMEGRIP_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${SEO_CONFIG_FILE:-./seo.config.json}
        target: /etc/timegrip/seo.config.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - timegrip

  nginx:
    container_name: timegrip-nginx
    image: ghcr.io/andprov/timegrip-nginx:${TIMEGRIP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      DOMAIN_ALIASES: ${DOMAIN_ALIASES:-}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
    networks:
      - timegrip

  certbot:
    container_name: timegrip-certbot
    image: ghcr.io/andprov/timegrip-certbot:${TIMEGRIP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      DOMAIN_ALIASES: ${DOMAIN_ALIASES:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-False}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - timegrip

networks:
  timegrip:

volumes:
  postgres_data:
  letsencrypt:
  certbot_webroot:
